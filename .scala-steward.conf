# Published plugin compiler lines must remain compatible with the supported sbt
# versions. Allow patch updates, but require manual review of a new compiler line.
# See AGENTS.md. Pins apply to every configured build root. Keep discovery on the
# plugin build; examples include other compiler lines and need separate policy.
buildRoots = ["."]

updates.pin = [
  { groupId = "org.scala-lang", artifactId = "scala-library", version = "2.12." },
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.8." },

  # Updating the repository launcher to sbt 2 is a build migration. The minimum
  # plugin targets are protected separately by scala-steward:off in build.sbt.
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." },
  { groupId = "org.scala-sbt", artifactId = "scripted-plugin", version = "1." }
]
